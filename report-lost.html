<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Item | Campus Lost & Found</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <img src="cu-logo.jpg" alt="CU Logo" class="logo-img">
      <span>Capitol University</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="report-lost.html" class="active">Report</a></li>
        <li><a href="about.html">ABOUT</a></li>
      </ul>
    </nav>
  </header>

  <section class="form-section">
    <h1 id="reportTitle">Report Lost Item</h1>
    <p id="reportDescription">Please fill out the details below to report your lost item.</p>

    <form id="reportForm">
      <div class="form-group">
        <label for="reportType">What do you want to report?</label>
        <select id="reportType" name="reportType" required>
          <option value="lost">Lost Item</option>
          <option value="found">Found Item</option>
        </select>
      </div>

      <div class="form-group">
        <label for="studentName">Full Name</label>
        <input type="text" id="studentName" name="studentName" required>
      </div>

      <div class="form-group">
        <label for="studentID">Student ID</label>
        <input type="text" id="studentID" name="studentID" required>
      </div>

      <div class="form-group">
        <label for="itemTitle">Item Title</label>
        <input type="text" id="itemTitle" name="itemTitle" required>
      </div>

      <div class="form-group">
        <label for="itemDescription">Description</label>
        <textarea id="itemDescription" name="itemDescription" rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="itemCategory">Category</label>
        <select id="itemCategory" name="itemCategory" required>
          <option value="">Select Category</option>
          <option>Wallet</option>
          <option>Phone</option>
          <option>Laptop</option>
          <option>Bag</option>
          <option>Keys</option>
          <option>Umbrella</option>
          <option>Books</option>
          <option>Calculator</option>
          <option>Clothing</option>
          <option>Accessories</option>
          <option>Electronics</option>
          <option>Others</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemLocation" id="locationLabel">Last Seen Location</label>
        <input type="text" id="itemLocation" name="itemLocation" required>
      </div>

      <div class="form-group">
        <label for="itemDate" id="dateLabel">Date Lost</label>
        <input type="date" id="itemDate" name="itemDate" required>
      </div>

      <div class="form-group">
        <label for="itemImage">Upload Image</label>
        <input type="file" id="itemImage" name="itemImage" accept="image/*">
        <small>Images can be previewed here; image storage is not configured yet.</small>
        <img id="previewImage" src="cu-bg.png" alt="Preview" class="preview">
      </div>

      <button type="submit" class="btn-primary" id="reportSubmitBtn">Submit Lost Report</button>
    </form>
  </section>

  <footer>
    <img src="cu-logo.jpg" alt="CU Logo" class="footer-logo">
    <p>&copy; 2026 Capitol University | Campus Lost & Found</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
