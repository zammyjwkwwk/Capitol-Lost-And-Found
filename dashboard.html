<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Campus Lost & Found</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <div class="logo">
      <img src="cu-logo.jpg" alt="CU Logo" class="logo-img">
      <span>Capitol University</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="report-lost.html">Report</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="login.html" class="btn-logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== Dashboard ===== -->
  <section class="dashboard">

    <!-- Profile Header -->
    <div class="profile-header">
      <img src="cu-logo.jpg" alt="Profile" class="profile-img">
      <div>
        <h2 id="welcomeUser">Hello, Student!</h2>
        <p>Campus lost and found</p>
      </div>
      <button class="btn-logout">Logout</button>
    </div>

    <!-- Search & Filter -->
    <div class="dashboard-search">
      <input type="text" id="searchBar" placeholder="Search items...">
      <select id="filterCategory">
        <option value="">All Categories</option>
        <option value="Wallet">Wallet</option>
        <option value="Phone">Phone</option>
        <option value="Laptop">Laptop</option>
        <option value="Bag">Bag</option>
        <option value="Keys">Keys</option>
        <option value="Books">Books</option>
        <option value="Umbrella">Umbrella</option>
        <option value="Calculator">Calculator</option>
        <option value="Clothing">Clothing</option>
        <option value="Accessories">Accessories</option>
        <option value="Electronics">Electronics</option>
      </select>
    </div>

    <!-- Activity Timeline -->
    <h3>Recent Activity</h3>
    <ul class="timeline" id="activityFeed">
      <!-- Activity items will be injected dynamically -->
    </ul>

    <!-- All Reports -->
    <div class="item-grid" id="itemGrid">
      <!-- All lost, found, and claimed items will be injected dynamically -->
    </div>

    <!-- Floating Action Button -->
    <a class="fab" href="report-lost.html" title="Add Report" aria-label="Add report">+</a>
  </section>

  <!-- ===== Footer ===== -->
  <footer>
    <img src="cu-logo.jpg" alt="CU Logo" class="footer-logo">
    <p>&copy; 2026 Capitol University | Campus Lost & Found</p>
    <p>Contact: lostfound@capitol.edu</p>
  </footer>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
