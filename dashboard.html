<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Reports | Capitol Lost & Found</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html"><img src="cu-logo.jpg" alt="Capitol University logo"><span>Capitol <strong>Lost & Found</strong></span></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a><a href="dashboard.html" class="active">Browse reports</a>
      <a href="report-lost.html">Report item</a>
      <a href="about.html">About</a><a href="admin-login.html">Admin</a>
    </nav>
  </header>

  <main class="dashboard page-width">
    <div class="page-heading">
      <div><p class="eyebrow">CAMPUS REPORTS</p><h1>Find an item</h1><p>Search reports and share helpful information with a comment.</p></div>
      <a class="button button-primary" href="report-lost.html">＋ New report</a>
    </div>

    <section class="filter-panel" aria-label="Search and filter reports">
      <div class="search-control"><label for="searchBar">Search</label><input id="searchBar" type="search" placeholder="Item, category, location..."></div>
      <div><label for="filterType">Report type</label><select id="filterType"><option value="">Lost and found</option><option value="lost">Lost</option><option value="found">Found</option></select></div>
      <div><label for="filterStatus">Claim status</label><select id="filterStatus"><option value="">All statuses</option><option value="not_claimed">Not claimed</option><option value="claimed">Claimed</option></select></div>
      <div><label for="filterCategory">Category</label><select id="filterCategory"><option value="">All categories</option><option>Wallet</option><option>Phone</option><option>Laptop</option><option>Bag</option><option>Keys</option><option>Umbrella</option><option>Books</option><option>Calculator</option><option>Clothing</option><option>Accessories</option><option>Electronics</option><option>Others</option></select></div>
    </section>

    <div class="results-heading"><h2>All reports</h2><span id="reportCount" aria-live="polite">0 reports</span></div>
    <section class="item-grid" id="itemGrid" aria-live="polite"></section>
  </main>

  <footer class="site-footer"><img src="cu-logo.jpg" alt="Capitol University logo"><p>Capitol University Campus Lost & Found</p><a href="about.html">About this project</a></footer>
  <script src="app.js"></script>
</body>
</html>
